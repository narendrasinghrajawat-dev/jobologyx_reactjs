<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" className="jobologyx-logo-icon">
  <defs>
    <linearGradient id="jx-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="jx-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="jx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#06B6D4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- J Stem with rounded hook and connectivity nodes -->
  <path d="M 18 10 L 18 28 C 18 34 13 37 8 35 C 5.5 34 4 31.5 4 28.5" 
        stroke="url(#jx-grad-1)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Top dot of J / Talent Node -->
  <circle cx="18" cy="8" r="3" fill="url(#jx-grad-1)" />

  <!-- The X Nexus & Career Elevation Arrows -->
  <!-- Diagonal 1: Top-Left to Bottom-Right -->
  <path d="M 14 14 L 34 38" 
        stroke="url(#jx-grad-1)" 
        stroke-width="4.5" 
        stroke-linecap="round" />

  <!-- Diagonal 2: Bottom-Left to Top-Right with Upward Career Arrow -->
  <path d="M 16 38 L 38 12" 
        stroke="url(#jx-grad-2)" 
        stroke-width="4.5" 
        stroke-linecap="round" />

  <!-- Arrowheads on top right -->
  <path d="M 31 12 L 39 11 L 38 19" 
        stroke="url(#jx-grad-2)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <path d="M 38 20 L 44 14 L 43 23" 
        stroke="url(#jx-grad-2)" 
        stroke-width="2.8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Tech Talent Connection Nodes -->
  <circle cx="27" cy="24.5" r="3" fill="#06B6D4" stroke="#FFFFFF" stroke-width="1.2" filter="url(#jx-glow)" />
  <circle cx="34" cy="38" r="2.5" fill="#7C3AED" />
  <circle cx="8" cy="35" r="2" fill="#0284C7" />
</svg>
